<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlimfyBox</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='miniapp/app.css') }}">
</head>
<body>
    <header class="app-header">
        <div class="brand-mark"><i class="fas fa-play"></i></div>
        <div class="brand-copy"><div class="logo">FlimfyBox</div><span>YOUR MOVIE SPACE</span></div>
        <button class="header-action" type="button" aria-label="My list" onclick="showMyList()"><i class="far fa-bookmark"></i></button>
    </header>
    <div class="search-section">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search movies, web series...">
        </div>
        <div class="search-dropdown-container">
            <div id="searchDropdown" class="search-dropdown"></div>
        </div>
    </div>
    <div class="genre-scroll" id="genreContainer"></div>

    <div id="mainContent">
        <div class="hero-slider" id="heroSlider">
            <div class="hero-overlay">
                <div class="hero-info">
                    <span class="eyebrow">FEATURED TODAY</span>
                    <h2 id="heroTitle">Loading...</h2>
                    <p id="heroMeta">Premium Collection</p>
                    <div class="hero-actions">
                        <button class="watch-button" type="button" id="heroWatch"><i class="fas fa-play"></i> Watch now</button>
                        <button class="round-button" type="button" aria-label="Add to My List" onclick="toggleCurrentMyList()"><i class="fas fa-plus"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <div class="movie-row" id="rowTrending">
            <div class="row-header">
                <div class="row-header-left"><i class="fas fa-fire"></i> Trending Now</div>
                <div class="scroll-buttons">
                    <div class="scroll-btn" onclick="scrollRow('trendingScroll', -400)"><i class="fas fa-chevron-left"></i></div>
                    <div class="scroll-btn" onclick="scrollRow('trendingScroll', 400)"><i class="fas fa-chevron-right"></i></div>
                </div>
            </div>
            <div class="horizontal-scroll" id="trendingScroll"></div>
        </div>

        <div class="movie-row" id="rowBollywood">
            <div class="row-header">
                <div class="row-header-left"><i class="fas fa-film"></i> Bollywood Gold</div>
                <div class="scroll-buttons">
                    <div class="scroll-btn" onclick="scrollRow('bollywoodScroll', -400)"><i class="fas fa-chevron-left"></i></div>
                    <div class="scroll-btn" onclick="scrollRow('bollywoodScroll', 400)"><i class="fas fa-chevron-right"></i></div>
                </div>
            </div>
            <div class="horizontal-scroll" id="bollywoodScroll"></div>
        </div>

        <div class="movie-row" id="rowHollywood">
            <div class="row-header">
                <div class="row-header-left"><i class="fas fa-globe"></i> Hollywood Hits</div>
                <div class="scroll-buttons">
                    <div class="scroll-btn" onclick="scrollRow('hollywoodScroll', -400)"><i class="fas fa-chevron-left"></i></div>
                    <div class="scroll-btn" onclick="scrollRow('hollywoodScroll', 400)"><i class="fas fa-chevron-right"></i></div>
                </div>
            </div>
            <div class="horizontal-scroll" id="hollywoodScroll"></div>
        </div>

        <div style="margin-top: 40px;">
            <div class="row-header"><i class="fas fa-layer-group"></i> Explore All</div>
            <div class="movie-grid" id="moreGrid"></div>
        </div>
    </div>

    <div id="searchResultsContent" style="display: none;">
        <div class="row-header" id="searchHeader"><i class="fas fa-search"></i> Search Results</div>
        <div class="movie-grid" id="searchGrid"></div>
    </div>

    <div id="myListContent" style="display: none;">
        <div class="row-header"><div class="row-header-left"><i class="far fa-bookmark"></i> My List</div></div>
        <div class="my-list-subtitle">Saved to your Telegram account</div>
        <div class="movie-grid" id="myListGrid"></div>
    </div>

    <div class="details-page" id="detailsPage">
        <div class="dp-header">
            <button class="btn-back" onclick="closeDetails()"><i class="fas fa-chevron-left"></i></button>
            <button class="btn-more" type="button" aria-label="More actions" onclick="showToast('More actions coming soon')"><i class="fas fa-ellipsis-h"></i></button>
        </div>
        <div class="dp-layout">
            <div class="dp-backdrop" id="dpBackdrop"></div>
            <div class="dp-info">
                <div class="dp-title-row">
                    <div class="dp-poster-float" id="dpPosterFloat">
                        <img id="dpFloatPoster" src="" alt="Poster">
                    </div>
                    <h1 class="dp-title" id="dpTitle">Title</h1>
                </div>
                <div class="rich-info-box" id="dpRichInfo">
                    <div class="info-pill highlight"><i class="fas fa-star"></i> <span id="dpRating">—</span></div>
                    <div class="info-pill"><span id="dpGenre">—</span></div>
                    <div class="info-pill"><i class="fas fa-volume-up"></i> <span>Dual Audio</span></div>
                </div>
                <div class="detail-actions">
                    <button class="detail-play" type="button" onclick="document.querySelector('#dpTrailerBtn .btn-trailer, #dpTrailerBtn .btn-request')?.click()"><i class="fas fa-play"></i> Play trailer</button>
                    <button class="detail-icon-button" id="detailMyListButton" type="button" aria-label="Add to My List" onclick="toggleCurrentMyList()"><i class="fas fa-plus"></i></button>
                    <button class="detail-icon-button" type="button" aria-label="Share" onclick="showToast('Share link copied')"><i class="fas fa-share-alt"></i></button>
                </div>
                <section class="overview-section">
                    <h2>Overview</h2>
                    <div class="rich-desc" id="dpDesc">Loading story...</div>
                </section>
                <div id="castSection" class="cast-list"></div>
                <div id="dpTrailerBtn"></div>
                <div id="dpSeasons" class="seasons-container"></div>
                <div class="dl-section" id="dpLinks"></div>
            </div>
        </div>
    </div>

    <div class="trailer-modal" id="trailerModal">
        <div class="trailer-wrapper">
            <iframe id="trailerIframe" src="" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
        </div>
        <button class="close-trailer-btn" onclick="closeTrailer()"><i class="fas fa-times"></i> Close</button>
    </div>

    <!-- Web Player Modal -->
    <div class="web-player-modal" id="webPlayerModal">
        <div class="wp-header">
            <div class="wp-title" id="wpTitle">Loading...</div>
            <button class="wp-close" onclick="closeWebPlayer()"><i class="fas fa-times"></i></button>
        </div>
        <div class="wp-iframe-container" id="wpIframeContainer">
            <!-- Iframe dynamically inserted here -->
        </div>
    </div>

    <div class="toast" id="toast">✅ Done!</div>

    <nav class="bottom-nav" aria-label="Main navigation">
        <button class="nav-item active" type="button" onclick="showHome()"><i class="fas fa-house"></i><span>Home</span></button>
        <button class="nav-item" type="button" onclick="showSearch()"><i class="fas fa-magnifying-glass"></i><span>Search</span></button>
        <button class="nav-item" type="button" onclick="showMyList()"><i class="far fa-bookmark"></i><span>My List</span></button>
    </nav>

    <script src="{{ url_for('static', filename='miniapp/app.js') }}"></script>
</body>
</html>
